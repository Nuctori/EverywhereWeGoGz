name: Check WeChat Articles And SUP Orders

on:
  schedule:
    # 10:00 Asia/Shanghai = 02:00 UTC.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      execute_orders:
        description: 'Create real SUP orders for newly detected articles'
        required: true
        default: false
        type: boolean

concurrency:
  group: check-wechat-articles-and-sup-orders
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WECHAT_PROCESSED_ARTICLE_VARIABLE: WECHAT_PROCESSED_ARTICLE_IDS
  CHECK_RESULT_PATH: ${{ runner.temp }}/wechat-article-check.json
  SUP_RESULT_PATH: ${{ runner.temp }}/wechat-sup-result.json
  SUP_API_BASE_URL: https://sup.yileyuns.com

jobs:
  check-and-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify SUP relay helper
        run: |
          python3 scripts/test_run_remote_wechat_sup_orders.py
          python3 scripts/test_deploy_remote_wechat_sup_orders.py

      - name: Check published articles
        id: check_articles
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          PREVIOUS_ARTICLE_IDS: ${{ vars.WECHAT_PROCESSED_ARTICLE_IDS }}
          LEGACY_ARTICLE_ID: ${{ vars.WECHAT_LAST_ARTICLE_ID }}
        run: |
          node scripts/check_wechat_published_article.mjs \
            --count 20 \
            --previous-article-ids "$PREVIOUS_ARTICLE_IDS" \
            --legacy-article-id "$LEGACY_ARTICLE_ID" > "$CHECK_RESULT_PATH"

          node --input-type=module - "$CHECK_RESULT_PATH" "$GITHUB_OUTPUT" <<'EOF'
          import fs from 'node:fs';

          const [resultPath, outputPath] = process.argv.slice(2);
          const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          const lines = [
            `new_articles_count=${result.newArticles.length}`,
            `baseline_initialized=${result.baselineInitialized}`,
          ];
          fs.appendFileSync(outputPath, `${lines.join('\\n')}\\n`);

          const clean = (value) => String(value || '').replace(/[\\r\\n]/g, ' ');
          const summary = [
            '## WeChat article check',
            '',
            `- Articles checked: ${result.articles.length}`,
            `- New articles: ${result.newArticles.length}`,
            result.baselineInitialized ? '- Baseline: initialized; no orders created' : '',
            ...result.newArticles.map((article) => `- ${clean(article.title)}: ${clean(article.url)}`),
            '',
          ].filter(Boolean).join('\\n') + '\\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          EOF

      - name: Start SSH agent for SUP relay
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.WECHAT_PUBLISH_SSH_KEY }}

      - name: Configure pinned SUP relay host key
        env:
          WECHAT_PUBLISH_KNOWN_HOSTS: ${{ secrets.WECHAT_PUBLISH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          test -n "$WECHAT_PUBLISH_KNOWN_HOSTS"
          printf '%s\n' "$WECHAT_PUBLISH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Preflight or create SUP orders through publish server
        id: sup_orders
        env:
          SUP_APP_ID: ${{ secrets.SUP_APP_ID }}
          SUP_APP_SECRET: ${{ secrets.SUP_APP_SECRET }}
          SUP_PURCHASE_ENABLED: ${{ vars.SUP_PURCHASE_ENABLED }}
          COMPLETED_ORDER_KEYS: ${{ vars.WECHAT_SUP_COMPLETED_ORDER_KEYS }}
          FORCE_EXECUTE_ORDERS: ${{ inputs.execute_orders }}
          WECHAT_PUBLISH_SSH_TARGET: ${{ secrets.WECHAT_PUBLISH_SSH_TARGET }}
          WECHAT_PUBLISH_REMOTE_DIR: ${{ secrets.WECHAT_PUBLISH_REMOTE_DIR }}
        run: |
          execute_orders=false
          if [ "$SUP_PURCHASE_ENABLED" = "true" ] || [ "$FORCE_EXECUTE_ORDERS" = "true" ]; then
            execute_orders=true
          fi

          python3 scripts/deploy_remote_wechat_sup_orders.py \
            --host "$WECHAT_PUBLISH_SSH_TARGET" \
            --remote-dir "${WECHAT_PUBLISH_REMOTE_DIR%/}/sup-orders/$GITHUB_RUN_ID" \
            --check-result "$CHECK_RESULT_PATH" \
            --execute "$execute_orders" \
            --output "$SUP_RESULT_PATH"

          node --input-type=module - "$SUP_RESULT_PATH" "$GITHUB_OUTPUT" <<'EOF'
          import fs from 'node:fs';

          const [resultPath, outputPath] = process.argv.slice(2);
          const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          fs.appendFileSync(outputPath, [
            `update_state=${result.updateState}`,
            `processed_article_ids=${JSON.stringify(result.processedArticleIds)}`,
            `completed_order_keys=${JSON.stringify(result.completedOrderKeys || [])}`,
            `order_status=${result.status}`,
            `order_errors_count=${result.errors?.length || 0}`,
          ].join('\\n') + '\\n');

          const summary = [
            '## SUP order result',
            '',
            `- Mode: ${result.status}`,
            `- Preflight entries: ${result.preflight?.length || 0}`,
            `- Orders created: ${result.orders?.length || 0}`,
            ...(result.orders || []).map((order) => `- ${order.articleId} / ${order.productKey}: ${order.orderSn || 'no order number'}`),
            ...(result.errors || []).map((error) => `- ERROR ${error.articleId} / ${error.productKey}: ${error.message}`),
            '',
          ].join('\\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          EOF

      - name: Update processed article state
        if: steps.sup_orders.outputs.update_state == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTICLE_IDS: ${{ steps.sup_orders.outputs.processed_article_ids }}
          ORDER_KEYS: ${{ steps.sup_orders.outputs.completed_order_keys }}
          VARIABLE_NAME: ${{ env.WECHAT_PROCESSED_ARTICLE_VARIABLE }}
        run: |
          order_keys_path="repos/${GITHUB_REPOSITORY}/actions/variables/WECHAT_SUP_COMPLETED_ORDER_KEYS"
          if gh api "$order_keys_path" >/dev/null 2>&1; then
            gh api --method PATCH "$order_keys_path" -f value="$ORDER_KEYS" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
              -f name="WECHAT_SUP_COMPLETED_ORDER_KEYS" \
              -f value="$ORDER_KEYS" >/dev/null
          fi

          variable_path="repos/${GITHUB_REPOSITORY}/actions/variables/${VARIABLE_NAME}"
          if gh api "$variable_path" >/dev/null 2>&1; then
            gh api --method PATCH "$variable_path" -f value="$ARTICLE_IDS" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
              -f name="$VARIABLE_NAME" \
              -f value="$ARTICLE_IDS" >/dev/null
          fi

      - name: Fail after persisting partial order state
        if: steps.sup_orders.outputs.order_status == 'partial_failure'
        run: |
          echo "Some SUP orders failed after successful orders were persisted; rerun to retry only pending article/product pairs."
          exit 1
