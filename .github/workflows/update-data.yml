name: Update Tour Data

on:
  # 定时触发：每天凌晨 3 点（UTC）
  schedule:
    - cron: '0 3 * * *'
  # 手动触发
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DETAIL_FETCH_MODE: cache
  IMAGE_CACHE_MODE: remote
  AVAILABILITY_FILTER: 0
  JRT365_AVAILABILITY_FILTER: 1
  JLB_AVAILABILITY_FILTER: 1

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Install Node dependencies
        run: npm ci

      - name: Run full source crawls
        run: |
          python scripts/crawl_jrt365_full.py
          python scripts/crawl_saihuitong_full.py
          python scripts/crawl_pintu_full.py
          python scripts/crawl_gzl_api.py
          python scripts/crawl_outdoors_full.py
          python scripts/full_crawl_v3.py

      - name: Merge crawled data
        run: python scripts/merge_data.py

      - name: Split merged data
        run: npm run data:split

      - name: Optimize cached images
        run: npm run data:images:webp

      - name: Audit merged data
        run: npm run audit:data-integrity

      - name: Summarize audit report
        if: always()
        run: |
          if [ ! -f audit/data-integrity-report.json ]; then
            echo "## Data integrity audit" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Audit report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node --input-type=module - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';

          const report = JSON.parse(fs.readFileSync('audit/data-integrity-report.json', 'utf8'));
          const errors = Array.isArray(report.errors) ? report.errors : [];
          const warnings = Array.isArray(report.warnings) ? report.warnings : [];

          console.log('## Data integrity audit');
          console.log('');
          console.log(`- Status: ${report.status}`);
          console.log(`- Total tours: ${report.counts?.totalTours ?? 'n/a'}`);
          console.log(`- Detail shards: ${report.counts?.detailShards ?? 'n/a'}`);
          console.log(`- Errors: ${errors.length}`);
          console.log(`- Warnings: ${warnings.length}`);

          if (errors.length > 0) {
            console.log('');
            console.log('Top errors:');
            for (const error of errors.slice(0, 10)) {
              console.log(`- ${error}`);
            }
          }
          EOF

      - name: Upload audit report
        if: always() && hashFiles('audit/data-integrity-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: data-integrity-report
          path: audit/data-integrity-report.json
          if-no-files-found: error

      - name: Check if data changed
        id: check_changes
        run: |
          git add src/data/tours.ts public/data/tours.json public/data/tours-list.json public/data/tours-meta.json public/data/tours-index.json public/data/tours-page-*.json public/data/tour-details src/data/raw_jrt365_full.json src/data/raw_jrt365.json src/data/raw_saihuitong_full.json src/data/raw_kanghui.json src/data/raw_pintu_full.json src/data/raw_gzl_api.json src/data/raw_http_full.json src/data/raw_outdoors_full.json src/data/tour-availability-cache.json public/data/image-cache
          if git diff --cached --quiet; then
            echo "Data unchanged, skipping build and deploy"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Data changed, proceeding with build and deploy"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit data changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update tour data [$(date +%Y-%m-%d)]"
          git push
        continue-on-error: true
