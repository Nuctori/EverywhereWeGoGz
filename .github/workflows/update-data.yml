name: Update Tour Data

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      skip_crawls:
        description: 'Skip external crawls and validate downstream processing only'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DETAIL_FETCH_MODE: cache
  IMAGE_CACHE_MODE: remote
  AVAILABILITY_FILTER: 0
  JRT365_AVAILABILITY_FILTER: 1
  JLB_AVAILABILITY_FILTER: 1

jobs:
  crawl-jrt365:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Verify JRT365 crawl guard
        run: npm run audit:jrt365-crawl-guard

      - name: Crawl JRT365 full
        timeout-minutes: 60
        run: python -u scripts/crawl_jrt365_full.py

      - name: Upload JRT365 raw data
        uses: actions/upload-artifact@v4
        with:
          name: raw-jrt365
          path: src/data/raw_jrt365_full.json
          if-no-files-found: error

  crawl-saihuitong:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Crawl Saihuitong full
        timeout-minutes: 60
        run: python -u scripts/crawl_saihuitong_full.py

      - name: Upload Saihuitong raw data
        uses: actions/upload-artifact@v4
        with:
          name: raw-saihuitong
          path: src/data/raw_saihuitong_full.json
          if-no-files-found: error

  crawl-pintu:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Crawl Pintu full
        timeout-minutes: 60
        run: python -u scripts/crawl_pintu_full.py

      - name: Upload Pintu raw data
        uses: actions/upload-artifact@v4
        with:
          name: raw-pintu
          path: src/data/raw_pintu_full.json
          if-no-files-found: error

  crawl-gzl-api:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Crawl GZL API full
        timeout-minutes: 60
        run: python -u scripts/crawl_gzl_api.py

      - name: Upload GZL raw data
        uses: actions/upload-artifact@v4
        with:
          name: raw-gzl-api
          path: src/data/raw_gzl_api.json
          if-no-files-found: error

  crawl-outdoors:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Crawl Outdoors full
        timeout-minutes: 60
        run: python -u scripts/crawl_outdoors_full.py

      - name: Upload Outdoors raw data
        uses: actions/upload-artifact@v4
        with:
          name: raw-outdoors
          path: src/data/raw_outdoors_full.json
          if-no-files-found: error

  crawl-http-aggregate:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Crawl HTTP aggregate sources
        timeout-minutes: 60
        run: python -u scripts/full_crawl_v3.py

      - name: Upload HTTP aggregate raw data
        uses: actions/upload-artifact@v4
        with:
          name: raw-http
          path: src/data/raw_http_full.json
          if-no-files-found: error

  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - crawl-jrt365
      - crawl-saihuitong
      - crawl-pintu
      - crawl-gzl-api
      - crawl-outdoors
      - crawl-http-aggregate
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.crawl-jrt365.result == 'success' && needs.crawl-saihuitong.result == 'success' && needs.crawl-pintu.result == 'success' && needs.crawl-gzl-api.result == 'success' && needs.crawl-outdoors.result == 'success' && needs.crawl-http-aggregate.result == 'success'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Install Node dependencies
        run: npm ci

      - name: Download JRT365 raw data
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
        uses: actions/download-artifact@v4
        with:
          name: raw-jrt365
          path: src/data

      - name: Download Saihuitong raw data
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
        uses: actions/download-artifact@v4
        with:
          name: raw-saihuitong
          path: src/data

      - name: Download Pintu raw data
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
        uses: actions/download-artifact@v4
        with:
          name: raw-pintu
          path: src/data

      - name: Download GZL raw data
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
        uses: actions/download-artifact@v4
        with:
          name: raw-gzl-api
          path: src/data

      - name: Download Outdoors raw data
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
        uses: actions/download-artifact@v4
        with:
          name: raw-outdoors
          path: src/data

      - name: Download HTTP aggregate raw data
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
        uses: actions/download-artifact@v4
        with:
          name: raw-http
          path: src/data

      - name: Merge crawled data
        run: python -u scripts/merge_data.py

      - name: Split merged data
        run: npm run data:split

      - name: Optimize cached images
        run: npm run data:images:webp

      - name: Audit merged data
        run: npm run audit:data-integrity

      - name: Summarize audit report
        if: always()
        run: |
          if [ ! -f audit/data-integrity-report.json ]; then
            echo "## Data integrity audit" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Audit report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node --input-type=module - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';

          const report = JSON.parse(fs.readFileSync('audit/data-integrity-report.json', 'utf8'));
          const errors = Array.isArray(report.errors) ? report.errors : [];
          const warnings = Array.isArray(report.warnings) ? report.warnings : [];

          console.log('## Data integrity audit');
          console.log('');
          console.log(`- Status: ${report.status}`);
          console.log(`- Total tours: ${report.counts?.totalTours ?? 'n/a'}`);
          console.log(`- Detail shards: ${report.counts?.detailShards ?? 'n/a'}`);
          console.log(`- Errors: ${errors.length}`);
          console.log(`- Warnings: ${warnings.length}`);

          if (errors.length > 0) {
            console.log('');
            console.log('Top errors:');
            for (const error of errors.slice(0, 10)) {
              console.log(`- ${error}`);
            }
          }
          EOF

      - name: Upload audit report
        if: always() && hashFiles('audit/data-integrity-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: data-integrity-report
          path: audit/data-integrity-report.json
          if-no-files-found: error

      - name: Check if data changed
        id: check_changes
        run: |
          git add src/data/tours.ts public/data/tours.json public/data/tours-list.json public/data/tours-meta.json public/data/tours-index.json public/data/tours-page-*.json public/data/tour-details src/data/raw_jrt365_full.json src/data/raw_jrt365.json src/data/raw_saihuitong_full.json src/data/raw_kanghui.json src/data/raw_pintu_full.json src/data/raw_gzl_api.json src/data/raw_http_full.json src/data/raw_outdoors_full.json src/data/tour-availability-cache.json public/data/image-cache
          if git diff --cached --quiet; then
            echo "Data unchanged, skipping build and deploy"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Data changed, proceeding with build and deploy"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit data changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update tour data [$(date +%Y-%m-%d)]"
          git push
        continue-on-error: true
