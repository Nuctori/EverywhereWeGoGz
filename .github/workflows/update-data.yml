name: Update Tour Data

on:
  # 定时触发：每天凌晨 3 点（UTC）
  schedule:
    - cron: '0 3 * * *'
  # 手动触发
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Install Node dependencies
        run: npm ci

      - name: Run crawler
        run: python scripts/crawler.py

      - name: Check if data changed
        id: check_changes
        run: |
          git add src/data/tours.ts
          if git diff --cached --quiet; then
            echo "Data unchanged, skipping build and deploy"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Data changed, proceeding with build and deploy"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build
        if: steps.check_changes.outputs.changed == 'true'
        run: npm run build
        env:
          APP_BASE: EverywhereWeGoGz

      - name: Commit data changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update tour data [$(date +%Y-%m-%d)]"
          git push
        continue-on-error: true

      - name: Upload artifact
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
