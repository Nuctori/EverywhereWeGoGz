name: Update Tour Data

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      skip_crawls:
        description: "Skip external crawls and validate downstream processing only"
        required: false
        default: "false"

concurrency:
  group: tour-data-writes
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DETAIL_FETCH_MODE: geo
  IMAGE_CACHE_MODE: remote
  AVAILABILITY_FILTER: 0
  JRT365_AVAILABILITY_FILTER: 1
  GZL_AVAILABILITY_FILTER: 1
  JLB_AVAILABILITY_FILTER: 1

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install OSM parser for index checks
        run: pip install osmium

      - name: Verify crawler syntax
        run: npm run audit:crawler-syntax

      - name: Verify update workflow contract
        run: |
          npm run audit:update-data-workflow
          npm run test:osm-poi-workflow
          python scripts/test_osm_poi_index.py
          python scripts/test_fix_label_only_geocode_mismatch.py
          python scripts/test_rebuild_geo_data.py
          python scripts/test_geo_schema_guard.py

  crawl-jrt365:
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Verify JRT365 crawl guard
        run: npm run audit:jrt365-crawl-guard

      - name: Crawl JRT365 full
        id: crawl
        timeout-minutes: 60
        # 单渠道失败不阻断整轮：守卫拒绝脏数据、对方站点反爬升级都属正常波动，
        # merge_data.py 对缺失来源沿用上一轮数据（断供保护）。降级原因进 summary 提醒。
        continue-on-error: true
        run: python -u scripts/crawl_jrt365_full.py

      - name: Record JRT365 outcome
        if: always()
        env:
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        run: |
          echo "ok=true" >> "$GITHUB_OUTPUT"
          if [ "$CRAWL_OUTCOME" != "success" ]; then
            echo "⚠️ JRT365 爬取失败（outcome=$CRAWL_OUTCOME），本轮沿用上一轮数据" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JRT365 raw data
        if: steps.crawl.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-jrt365
          path: src/data/raw_jrt365_full.json
          if-no-files-found: error

  crawl-saihuitong:
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Crawl Saihuitong full
        id: crawl
        timeout-minutes: 60
        continue-on-error: true
        run: python -u scripts/crawl_saihuitong_full.py

      - name: Upload Saihuitong raw data
        if: steps.crawl.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-saihuitong
          path: src/data/raw_saihuitong_full.json
          if-no-files-found: error

      - name: Record Saihuitong outcome
        if: always()
        env:
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        run: |
          echo "ok=true" >> "$GITHUB_OUTPUT"
          if [ "$CRAWL_OUTCOME" != "success" ]; then
            echo "⚠️ Saihuitong 爬取失败（outcome=$CRAWL_OUTCOME），本轮沿用上一轮数据" >> "$GITHUB_STEP_SUMMARY"
          fi


  crawl-kanghui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: preflight
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Crawl Kanghui full
        id: crawl
        timeout-minutes: 60
        continue-on-error: true
        run: python -u scripts/crawl_kanghui_full.py

      - name: Upload Kanghui raw data
        if: steps.crawl.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-kanghui
          path: src/data/raw_kanghui.json
          if-no-files-found: error

      - name: Record Kanghui outcome
        if: always()
        env:
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        run: |
          echo "ok=true" >> "$GITHUB_OUTPUT"
          if [ "$CRAWL_OUTCOME" != "success" ]; then
            echo "⚠️ Kanghui 爬取失败（outcome=$CRAWL_OUTCOME），本轮沿用上一轮数据" >> "$GITHUB_STEP_SUMMARY"
          fi


  crawl-pintu:
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Crawl Pintu full
        id: crawl
        timeout-minutes: 60
        continue-on-error: true
        run: python -u scripts/crawl_pintu_full.py

      - name: Upload Pintu raw data
        if: steps.crawl.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-pintu
          path: src/data/raw_pintu_full.json
          if-no-files-found: error

      - name: Record Pintu outcome
        if: always()
        env:
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        run: |
          echo "ok=true" >> "$GITHUB_OUTPUT"
          if [ "$CRAWL_OUTCOME" != "success" ]; then
            echo "⚠️ Pintu 爬取失败（outcome=$CRAWL_OUTCOME），本轮沿用上一轮数据" >> "$GITHUB_STEP_SUMMARY"
          fi


  crawl-gzl-api:
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Crawl GZL API full
        id: crawl
        timeout-minutes: 180
        continue-on-error: true
        run: python -u scripts/crawl_gzl_api.py

      - name: Upload GZL raw data
        if: steps.crawl.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-gzl-api
          path: src/data/raw_gzl_api.json
          if-no-files-found: error

      - name: Record GZL API outcome
        if: always()
        env:
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        run: |
          echo "ok=true" >> "$GITHUB_OUTPUT"
          if [ "$CRAWL_OUTCOME" != "success" ]; then
            echo "⚠️ GZL API 爬取失败（outcome=$CRAWL_OUTCOME），本轮沿用上一轮数据" >> "$GITHUB_STEP_SUMMARY"
          fi


  crawl-outdoors:
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Crawl Outdoors full
        id: crawl
        timeout-minutes: 60
        continue-on-error: true
        run: python -u scripts/crawl_outdoors_full.py

      - name: Upload Outdoors raw data
        if: steps.crawl.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-outdoors
          path: src/data/raw_outdoors_full.json
          if-no-files-found: error

      - name: Record Outdoors outcome
        if: always()
        env:
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        run: |
          echo "ok=true" >> "$GITHUB_OUTPUT"
          if [ "$CRAWL_OUTCOME" != "success" ]; then
            echo "⚠️ Outdoors 爬取失败（outcome=$CRAWL_OUTCOME），本轮沿用上一轮数据" >> "$GITHUB_STEP_SUMMARY"
          fi


  crawl-http-aggregate:
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Crawl HTTP aggregate sources
        id: crawl
        timeout-minutes: 60
        continue-on-error: true
        run: python -u scripts/full_crawl_v3.py

      - name: Upload HTTP aggregate raw data
        if: steps.crawl.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-http
          path: src/data/raw_http_full.json
          if-no-files-found: error

  # 单渠道爬取失败已由各 crawl job 内部降级（continue-on-error + job 级 ok 输出）：
  # 数据真空（<4 渠道产出 raw 文件）才阻断整轮；缺失来源由 merge_data.py 沿用上一轮线路，
  # 完整性审计仍是提交前最终质量门。降级明细看各 job 的 step summary。
  crawl-gate:
    runs-on: ubuntu-latest
    needs:
      - preflight
      - crawl-jrt365
      - crawl-saihuitong
      - crawl-kanghui
      - crawl-pintu
      - crawl-gzl-api
      - crawl-outdoors
      - crawl-http-aggregate
    if: always() && !cancelled() && needs.preflight.result == 'success'
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Evaluate crawl majority gate
        id: gate
        env:
          JRT365_OK: ${{ needs.crawl-jrt365.outputs.ok }}
          SAIHUITONG_OK: ${{ needs.crawl-saihuitong.outputs.ok }}
          KANGHUI_OK: ${{ needs.crawl-kanghui.outputs.ok }}
          PINTU_OK: ${{ needs.crawl-pintu.outputs.ok }}
          GZL_OK: ${{ needs.crawl-gzl-api.outputs.ok }}
          OUTDOORS_OK: ${{ needs.crawl-outdoors.outputs.ok }}
          HTTP_OK: ${{ needs.crawl-http-aggregate.outputs.ok }}
        run: |
          set -euo pipefail
          oks=("$JRT365_OK" "$SAIHUITONG_OK" "$KANGHUI_OK" "$PINTU_OK" "$GZL_OK" "$OUTDOORS_OK" "$HTTP_OK")
          successes=0
          for ok in "${oks[@]}"; do
            [ "$ok" = "true" ] && successes=$((successes + 1))
          done
          echo "crawl outputs ok: ${oks[*]} (successes=$successes/7)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$successes" -ge 4 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 托管 runner 对单 job 有 6h 硬上限，timeout-minutes 调不上去（2160 会被钳制），
    # 2026-09-04/05 两轮追赶都在 job 启动后 ~5h58m 被硬顶收掉。
    # 追赶轮的超量挖掘由下方 mine 步骤的有界超时兜底，job 自身保持默认余量。
    timeout-minutes: 360
    needs:
      - preflight
      - crawl-gate
      - crawl-jrt365
      - crawl-saihuitong
      - crawl-kanghui
      - crawl-pintu
      - crawl-gzl-api
      - crawl-outdoors
      - crawl-http-aggregate
    if: always() && !cancelled() && needs.preflight.result == 'success' && needs.crawl-gate.outputs.proceed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml selenium

      - name: Install Node dependencies
        run: npm ci

      - name: Download JRT365 raw data
        if: (!cancelled() && needs.crawl-jrt365.result == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'))
        uses: actions/download-artifact@v4
        with:
          name: raw-jrt365
          path: src/data

      - name: Download Saihuitong raw data
        if: (!cancelled() && needs.crawl-saihuitong.result == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'))
        uses: actions/download-artifact@v4
        with:
          name: raw-saihuitong
          path: src/data

      - name: Download Kanghui raw data
        if: (!cancelled() && needs.crawl-kanghui.result == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'))
        uses: actions/download-artifact@v4
        with:
          name: raw-kanghui
          path: src/data

      - name: Download Pintu raw data
        if: (!cancelled() && needs.crawl-pintu.result == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'))
        uses: actions/download-artifact@v4
        with:
          name: raw-pintu
          path: src/data

      - name: Download GZL raw data
        if: (!cancelled() && needs.crawl-gzl-api.result == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'))
        uses: actions/download-artifact@v4
        with:
          name: raw-gzl-api
          path: src/data

      - name: Download Outdoors raw data
        if: (!cancelled() && needs.crawl-outdoors.result == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'))
        uses: actions/download-artifact@v4
        with:
          name: raw-outdoors
          path: src/data

      - name: Download HTTP aggregate raw data
        if: (!cancelled() && needs.crawl-http-aggregate.result == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_crawls != 'true'))
        uses: actions/download-artifact@v4
        with:
          name: raw-http
          path: src/data

      - name: Merge crawled data
        run: python -u scripts/merge_data.py

      - name: Mine source geo evidence
        # 尽力而为：多周积压时单轮挖掘会超 6h 硬上限，不能让它阻断数据刷新。
        # 超时被收掉后管线继续走 split/audit/commit，地理覆盖沿用已入库缓存；
        # 挖掘债随每周轮次消化，真正的解法是挖掘增量落盘（TODO）。
        continue-on-error: true
        timeout-minutes: 90
        run: python -u scripts/source_geo_enrichment.py --network --write --workers 8

      - name: Split merged data
        run: npm run data:split

      - name: Clear wrong geocoder pins (label-only mismatches)
        run: python -u scripts/fix_label_only_geocode_mismatch.py

      - name: Resolve mined destination coordinates
        run: python -u scripts/rebuild_geo_data.py --network

      - name: Split merged data
        run: npm run data:split

      - name: Optimize cached images
        run: npm run data:images:webp

      - name: Audit merged data
        run: npm run audit:data-integrity

      - name: Summarize audit report
        if: always()
        run: |
          if [ ! -f audit/data-integrity-report.json ]; then
            echo "## Data integrity audit" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Audit report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node --input-type=module - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';

          const report = JSON.parse(fs.readFileSync('audit/data-integrity-report.json', 'utf8'));
          const errors = Array.isArray(report.errors) ? report.errors : [];
          const warnings = Array.isArray(report.warnings) ? report.warnings : [];

          console.log('## Data integrity audit');
          console.log('');
          console.log(`- Status: ${report.status}`);
          console.log(`- Total tours: ${report.counts?.totalTours ?? 'n/a'}`);
          console.log(`- Detail shards: ${report.counts?.detailShards ?? 'n/a'}`);
          console.log(`- Errors: ${errors.length}`);
          console.log(`- Warnings: ${warnings.length}`);

          if (errors.length > 0) {
            console.log('');
            console.log('Top errors:');
            for (const error of errors.slice(0, 10)) {
              console.log(`- ${error}`);
            }
          }
          EOF

      - name: Upload audit report
        if: always() && hashFiles('audit/data-integrity-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: data-integrity-report
          path: audit/data-integrity-report.json
          if-no-files-found: error

      - name: Check if data changed
        id: check_changes
        run: |
          git add src/data/tours.ts public/data/tours.json public/data/tours-list.json public/data/tours-meta.json public/data/tours-index.json public/data/tour-map-index.json public/data/tour-map-cards.json public/data/tour-map-place-cards public/data/tour-deeplink-index.json public/data/tours-page-*.json public/data/tour-details public/data/geo-places.json scripts/geo-geocode-cache.json src/data/raw_jrt365_full.json src/data/raw_jrt365.json src/data/raw_saihuitong_full.json src/data/raw_kanghui.json src/data/raw_pintu_full.json src/data/raw_gzl_api.json src/data/raw_http_full.json src/data/raw_outdoors_full.json public/data/image-cache
          if git diff --cached --quiet; then
            echo "Data unchanged, skipping build and deploy"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Data changed, proceeding with build and deploy"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit data changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git restore src/data/tour-availability-cache.json
          git commit -m "chore: update tour data [$(date +%Y-%m-%d)]"
          bash scripts/push_generated_commit.sh

  dispatch-weekly-wechat-article-fallback:
    needs: update-and-deploy
    if: always() && needs.update-and-deploy.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Weekly WeChat Article fallback
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weekly-wechat-article.yml',
              ref: context.ref.replace('refs/heads/', ''),
            });
            console.log('Dispatched weekly-wechat-article fallback using the last committed data.');

      - name: Record HTTP aggregate outcome
        if: always()
        env:
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        run: |
          echo "ok=true" >> "$GITHUB_OUTPUT"
          if [ "$CRAWL_OUTCOME" != "success" ]; then
            echo "⚠️ HTTP aggregate 爬取失败（outcome=$CRAWL_OUTCOME），本轮沿用上一轮数据" >> "$GITHUB_STEP_SUMMARY"
          fi

