name: Refresh OSM POI Index

on:
  schedule:
    # Monthly at 12:33 Asia/Shanghai. The raw extracts are downloaded only in this job.
    - cron: '33 4 1 * *'
  workflow_dispatch:

concurrency:
  group: tour-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-osm-poi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OSM extractor
        run: pip install osmium

      - name: Build regional OSM POI index
        run: python -u scripts/osm_poi_index.py

      - name: Verify OSM POI index
        run: |
          python scripts/test_osm_poi_index.py
          python scripts/audit_osm_poi_index.py

      - name: Apply OSM POIs to tour map data
        run: |
          python -u scripts/rebuild_geo_data.py
          node scripts/test_geo_data_layer.mjs

      - name: Commit POI index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/osm-poi-index.json public/data/tours.json public/data/tours-list.json public/data/tours-meta.json public/data/tours-index.json public/data/tour-deeplink-index.json public/data/tours-page-*.json public/data/tour-details public/data/geo-places.json public/data/tour-map-index.json public/data/tour-map-cards.json public/data/tour-map-place-cards
          if git diff --cached --quiet; then
            echo "OSM POI index unchanged"
            exit 0
          fi
          git commit -m "chore: refresh OSM POI index [$(date +%Y-%m-%d)]"
          bash scripts/push_generated_commit.sh
