name: Weekly WeChat Article

on:
  workflow_run:
    workflows:
      - Update Tour Data
    types:
      - completed
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WECHAT_CONTENT_SOURCE_URL: https://nuctori.github.io/EverywhereWeGoGz/

jobs:
  credentials:
    # 调度源失败时不必再预检；凭证坏 → 开/更新追踪 issue → 本轮整体绿灯跳过。
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # check_wechat_credentials.mjs 会创建 label、开关 issue；缺 write 权限时
      # 2026-11-16 的 403 让追踪 issue 根本没建出来。
      issues: write
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify WeChat credentials
        id: check
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          GH_TOKEN: ${{ github.token }}
        # 用 if/else 把脚本 exit 1 吸收成 ok=false：旧写法在后续步步跑，
        # 坏凭证时仍会去装 aider（2026-11-16 就是这样红的）。
        run: |
          if node scripts/check_wechat_credentials.mjs; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "凭证失效，已触发/更新追踪 issue；本轮整体跳过（绿灯），修复后自动恢复。"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  generate-and-publish:
    needs: credentials
    if: needs.credentials.outputs.ok == 'true'
    runs-on: ubuntu-latest
    # LLM 生成 + SSH 发布全流程；挂住时兜底，避免烧满 runner 默认的 360 分钟。
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # aider-chat 锁 numpy==1.24.3，只有 ≤3.11 有 wheel；runner 自带 3.12+
          # 会走源码构建，挂在 pkgutil.ImpImporter（2026-11-16 的红）。
          python-version: "3.11"

      - name: Install Aider
        run: |
          python -m pip install --user aider-chat
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Choose run date
        run: echo "RUN_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Verify weekly article tests
        run: |
          npm run test:weekly-wechat-workflow
          npm run test:weekly-wechat-article
          npm run test:weekly-wechat-agent-cli
          npm run test:wechat-publish
          npm run test:wechat-publish-bundle
          python scripts/test_deploy_remote_wechat_publish.py

      - name: Verify DeepSeek token
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY secret is missing"
            exit 1
          fi

      - name: Generate weekly article with Aider + DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          AIDER_MODEL: ${{ secrets.AIDER_MODEL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
        run: |
          export AIDER_MODEL="${AIDER_MODEL:-$DEEPSEEK_MODEL}"
          if [ -z "$AIDER_MODEL" ]; then
            echo "Aider model secret is missing. Configure AIDER_MODEL or DEEPSEEK_MODEL."
            exit 1
          fi
          npm run generate:weekly-wechat-article -- --date "$RUN_DATE" --variant-count 2

      - name: Prepare publish bundle
        env:
          WECHAT_NEED_OPEN_COMMENT: "1"
          WECHAT_ONLY_FANS_CAN_COMMENT: "0"
        run: npm run prepare:wechat-publish-bundle -- --date "$RUN_DATE"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.WECHAT_PUBLISH_SSH_KEY }}

      - name: Add remote host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.WECHAT_PUBLISH_KNOWN_HOST }}" >> ~/.ssh/known_hosts

      - name: Publish WeChat draft over SSH relay
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PUBLISH_SSH_TARGET: ${{ secrets.WECHAT_PUBLISH_SSH_TARGET }}
          WECHAT_PUBLISH_REMOTE_DIR: ${{ secrets.WECHAT_PUBLISH_REMOTE_DIR }}
        run: |
          python scripts/deploy_remote_wechat_publish.py \
            --host "$WECHAT_PUBLISH_SSH_TARGET" \
            --remote-dir "$WECHAT_PUBLISH_REMOTE_DIR/$RUN_DATE" \
            --bundle-path "weekly-wechat-posts/$RUN_DATE/publish-bundle.json" \
            --html-path "weekly-wechat-posts/$RUN_DATE/article.html" \
            --cover-path "weekly-wechat-posts/$RUN_DATE/cover-upload.jpg" \
            --app-id "$WECHAT_APP_ID" \
            --app-secret "$WECHAT_APP_SECRET"

      - name: Upload weekly article artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-wechat-${{ env.RUN_DATE }}
          path: weekly-wechat-posts/${{ env.RUN_DATE }}
          if-no-files-found: warn

      - name: Summarize publish result
        if: always()
        run: |
          if [ ! -f "weekly-wechat-posts/$RUN_DATE/publish-result.json" ]; then
            echo "## Weekly WeChat article" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Publish result not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node --input-type=module - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const runDate = process.env.RUN_DATE;
          const result = JSON.parse(fs.readFileSync(`weekly-wechat-posts/${runDate}/publish-result.json`, 'utf8'));
          console.log('## Weekly WeChat article');
          console.log('');
          console.log(`- Media ID: ${result.mediaId}`);
          console.log(`- Title: ${result.title || 'n/a'}`);
          console.log(`- Article artifact dir: weekly-wechat-posts/${runDate}`);
          EOF
