name: Weekly WeChat Article

on:
  workflow_run:
    workflows:
      - Update Tour Data
    types:
      - completed
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Aider
        run: |
          python3 -m pip install --user aider-chat
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Choose run date
        run: echo "RUN_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Verify weekly article tests
        run: |
          npm run test:weekly-wechat-article
          npm run test:weekly-wechat-agent-cli
          npm run test:wechat-publish
          npm run test:wechat-publish-bundle

      - name: Verify DeepSeek token
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY secret is missing"
            exit 1
          fi

      - name: Generate weekly article with Aider + DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          AIDER_MODEL: ${{ secrets.AIDER_MODEL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
        run: |
          export AIDER_MODEL="${AIDER_MODEL:-$DEEPSEEK_MODEL}"
          if [ -z "$AIDER_MODEL" ]; then
            echo "Aider model secret is missing. Configure AIDER_MODEL or DEEPSEEK_MODEL."
            exit 1
          fi
          npm run generate:weekly-wechat-article -- --date "$RUN_DATE" --variant-count 2

      - name: Prepare publish bundle
        env:
          WECHAT_NEED_OPEN_COMMENT: "1"
          WECHAT_ONLY_FANS_CAN_COMMENT: "0"
        run: npm run prepare:wechat-publish-bundle -- --date "$RUN_DATE"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.WECHAT_PUBLISH_SSH_KEY }}

      - name: Add remote host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.WECHAT_PUBLISH_KNOWN_HOST }}" >> ~/.ssh/known_hosts

      - name: Publish WeChat draft over SSH relay
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PUBLISH_SSH_TARGET: ${{ secrets.WECHAT_PUBLISH_SSH_TARGET }}
          WECHAT_PUBLISH_REMOTE_DIR: ${{ secrets.WECHAT_PUBLISH_REMOTE_DIR }}
        run: |
          python3 scripts/deploy_remote_wechat_publish.py \
            --host "$WECHAT_PUBLISH_SSH_TARGET" \
            --remote-dir "$WECHAT_PUBLISH_REMOTE_DIR/$RUN_DATE" \
            --bundle-path "weekly-wechat-posts/$RUN_DATE/publish-bundle.json" \
            --html-path "weekly-wechat-posts/$RUN_DATE/article.html" \
            --cover-path "weekly-wechat-posts/$RUN_DATE/cover-upload.jpg" \
            --app-id "$WECHAT_APP_ID" \
            --app-secret "$WECHAT_APP_SECRET"

      - name: Upload weekly article artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-wechat-${{ env.RUN_DATE }}
          path: weekly-wechat-posts/${{ env.RUN_DATE }}
          if-no-files-found: warn

      - name: Summarize publish result
        if: always()
        run: |
          if [ ! -f "weekly-wechat-posts/$RUN_DATE/publish-result.json" ]; then
            echo "## Weekly WeChat article" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Publish result not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node --input-type=module - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const runDate = process.env.RUN_DATE;
          const result = JSON.parse(fs.readFileSync(`weekly-wechat-posts/${runDate}/publish-result.json`, 'utf8'));
          console.log('## Weekly WeChat article');
          console.log('');
          console.log(`- Media ID: ${result.mediaId}`);
          console.log(`- Title: ${result.title || 'n/a'}`);
          console.log(`- Article artifact dir: weekly-wechat-posts/${runDate}`);
          EOF
