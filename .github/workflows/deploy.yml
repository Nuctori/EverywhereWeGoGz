name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: github-pages
    runs-on: ubuntu-latest
    # 无 job 级超时时 GitHub 默认给 360 分钟：构建/发布挂住会烧满 6 小时才被收掉。
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify deploy workflow contract
        run: npm run audit:deploy-workflow

      - name: Install dependencies
        run: npm ci

      - name: Setup Python audit dependencies
        uses: actions/setup-python@v5
        with:
          # 与 update-data/refresh-osm-poi 对齐；3.x 随 runner 镜像浮动，
          # lxml/bs4 大版本升级时会让部署审计在无人改动的情况下突然变红。
          python-version: "3.11"

      - name: Install Python audit dependencies
        run: python -m pip install requests beautifulsoup4 lxml

      - name: Data & deeplink guards (shipped artifact gates)
        run: |
          npm run test:source-detail-url
          npm run test:runtime-tour-schemas
          npm run test:ai-streaming
          npm run test:ai-streaming-progress
          python scripts/test_geo_schema_guard.py

      - name: Build
        run: npm run build:pages
        env:
          APP_BASE: EverywhereWeGoGz
          VITE_AI_DEFAULT_BASE_URL: https://api.z.ai/api/paas/v4
          VITE_AI_DEFAULT_MODEL: GLM-4.7-Flash
          VITE_AI_DEFAULT_API_KEY_B64: MmMzZjFiNjZkMDc4NDk5N2E0NmZlYzk5MzllZGU2MDguSlJ0NWJSRFl6T2NVWVVadg==
          VITE_AI_SECONDARY_BASE_URL: https://api.siliconflow.cn/v1
          VITE_AI_SECONDARY_MODEL: Qwen/Qwen3.5-4B
          VITE_AI_SECONDARY_API_KEY_B64: c2stcGF3ZGJzaXhucnhvY2NkY3VkeGVwbWhzZHdrZmtqcm5qeWZpemFlcnJ6eGF0bHdv
          VITE_AI_TERTIARY_BASE_URL: https://openrouter.ai/api/v1
          # 免费 slot 实测 2026-10-02：glm-4.5-air:free 已下架（404，免费档转付费），
          # dots-3-note-preview:free 三连调用 1.1~1.8s 直出中文内容、512K ctx。
          VITE_AI_TERTIARY_MODEL: dots-studio/dots-3-note-preview:free
          VITE_AI_TERTIARY_API_KEY_B64: c2stb3ItdjEtZTlkNGY2YmViOTk3NzNkZjc5NWEwMDNlM2NlYzQzYzE5NzI5YzQxYmY4MTk0ZGRhMjZmN2RkNTU1NGU5NzMwZg==
          VITE_AI_FALLBACK_BASE_URL: https://openrouter.ai/api/v1
          # 原 DeepSeek 官方 slot 欠费 402 退役（充值后可在 .env.example 恢复）；
          # laguna-xs-2.1:free 免费但上游偶发 429，只作最后兜底。
          VITE_AI_FALLBACK_MODEL: poolside/laguna-xs-2.1:free
          VITE_AI_FALLBACK_API_KEY_B64: c2stb3ItdjEtZTlkNGY2YmViOTk3NzNkZjc5NWEwMDNlM2NlYzQzYzE5NzI5YzQxYmY4MTk0ZGRhMjZmN2RkNTU1NGU5NzMwZg==

      - name: Publish build artifacts to CDN branch
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/cdn-assets"
          rm -rf "$artifact_dir"

          git fetch origin cdn-assets:refs/remotes/origin/cdn-assets || true
          if git show-ref --verify --quiet refs/remotes/origin/cdn-assets; then
            git worktree add --detach "$artifact_dir" refs/remotes/origin/cdn-assets
          else
            git worktree add --detach "$artifact_dir" HEAD
            git -C "$artifact_dir" checkout --orphan cdn-assets
          fi

          git -C "$artifact_dir" rm -rf . || true
          find "$artifact_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. "$artifact_dir/"
          rm -f "$artifact_dir/data/tours.json"
          git -C "$artifact_dir" add --all
          git -C "$artifact_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: publish Pages build artifacts'
          git -C "$artifact_dir" push --force origin HEAD:cdn-assets
          git worktree remove --force "$artifact_dir"

      - name: Strip oversized data from the Pages artifact
        # GitHub Pages 单产物上限 1GB。dist/data/image-cache 是 780MB 的优化后 webp 图库，
        # 同一份已随上面"Publish build artifacts"步骤完整写入 cdn-assets 分支，
        # 由 service worker 经 CDN 池直出（见 public/sw.js）。Pages 产物里重复打包它只会
        # 把产物顶到 1.1GB 触发告警、逼近硬上限。这里只在上传 Pages 前从 dist 移除它，
        # cdn-assets 的副本不受影响。tours.json(~57MB)同理——全量数据分片已在 cdn-assets，
        # 运行时也不需要整文件。
        run: |
          rm -rf dist/data/image-cache
          rm -f dist/data/tours.json
          echo "dist 体积: $(du -sh dist | cut -f1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
